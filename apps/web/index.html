<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e6" />
    <meta
      name="description"
      content="DebaMun es una mesa de preparación para modelos de las Naciones Unidas: elige tu país y comisión, recibe un dossier con fuentes, practica el debate y evalúa tu discurso."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DebaMun" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="DebaMun · Preparación para modelos de las Naciones Unidas" />
    <meta
      property="og:description"
      content="Dossier por país, asistente con fuentes y entrenador de debate para modelos de las Naciones Unidas."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DebaMun · Preparación para modelos de las Naciones Unidas" />
    <meta
      name="twitter:description"
      content="Dossier por país, asistente con fuentes y entrenador de debate para modelos de las Naciones Unidas."
    />
    <title>DebaMun · Preparación para modelos de las Naciones Unidas</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('debamun.color-scheme');
          const scheme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia?.('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.colorScheme = scheme;
          document.documentElement.style.colorScheme = scheme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', scheme === 'dark' ? '#1a1814' : '#f5f0e6');
        } catch {
          /* Sin preferencias guardadas: el tema claro sigue siendo el inicial. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
